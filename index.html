<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benjamin Nguyen — Aerospace Engineering</title>
  <meta name="description" content="Senior Director of Engineering and Industry Advisory Council member with extensive aerospace engineering leadership experience.">
  <meta property="og:title" content="Benjamin Nguyen — Aerospace Engineering">
  <meta property="og:description" content="Seasoned aerospace engineering executive in design, management, and program/portfolio management.">
  <meta property="og:type" content="website">
  <meta name="author" content="Benjamin Nguyen">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f4f4f5;
      --text-primary: #0a0a0a;
      --text-secondary: #52525b;
      --accent: #0a0a0a;
      --border: #e4e4e7;
      --dot-r: 10; --dot-g: 10; --dot-b: 10;
    }

    html.dark {
      --bg-primary: #0a0a0a;
      --bg-secondary: #161616;
      --text-primary: #fafafa;
      --text-secondary: #a1a1aa;
      --accent: #fafafa;
      --border: #27272a;
      --dot-r: 250; --dot-g: 250; --dot-b: 250;
    }

    html, body {
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: background 0.4s ease, color 0.4s ease;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 72px;
    }

    .logo {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .theme-toggle {
      width: 38px; height: 38px;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .theme-toggle:hover { border-color: var(--text-secondary); color: var(--text-primary); }
    .theme-toggle svg { width: 18px; height: 18px; display: block; }
    .theme-toggle .icon-sun { display: none; }
    html.dark .theme-toggle .icon-sun { display: block; }
    html.dark .theme-toggle .icon-moon { display: none; }

    .hero { text-align: center; margin-bottom: 64px; }

    .profile-image-container {
      margin: 0 auto 32px;
      width: 200px; height: 240px;
      position: relative;
    }
    .profile-canvas { width: 100%; height: 100%; display: block; }

    h1 { font-size: 40px; font-weight: 700; letter-spacing: -1px; margin-bottom: 6px; }
    .title { font-size: 16px; color: var(--text-secondary); margin-bottom: 8px; font-weight: 500; }
    .location {
      font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
      color: var(--text-secondary); margin-bottom: 24px;
    }
    .bio {
      max-width: 520px; margin: 0 auto;
      font-size: 15px; line-height: 1.7; color: var(--text-secondary);
    }

    .section { margin-bottom: 48px; }
    .section-label {
      font-size: 11px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; color: var(--text-secondary);
      margin-bottom: 16px;
    }
    .section p { font-size: 15px; line-height: 1.7; color: var(--text-secondary); margin-bottom: 12px; }

    .achievements { list-style: none; }
    .achievements li {
      position: relative;
      padding-left: 22px;
      font-size: 15px; line-height: 1.7;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }
    .achievements li::before {
      content: '';
      position: absolute;
      left: 4px; top: 11px;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--text-secondary);
    }

    .skills { display: flex; flex-wrap: wrap; gap: 8px; }
    .skill-tag {
      padding: 6px 13px;
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-radius: 6px; font-size: 13px;
      transition: all 0.2s ease;
    }
    .skill-tag:hover { border-color: var(--text-secondary); }

    .timeline { list-style: none; }
    .timeline-item {
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }
    .timeline-item:last-child { border-bottom: none; }
    .timeline-date {
      font-size: 12px; letter-spacing: 1px; text-transform: uppercase;
      color: var(--text-secondary); margin-bottom: 4px;
    }
    .timeline-role { font-size: 15px; font-weight: 600; color: var(--text-primary); }
    .timeline-org { font-size: 14px; color: var(--text-secondary); }

    .links { display: flex; flex-direction: column; gap: 2px; }
    .link-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 4px;
      text-decoration: none; color: var(--text-primary);
      border-bottom: 1px solid var(--border);
      transition: padding 0.2s ease;
    }
    .link-item:hover { padding-left: 12px; }
    .link-item .arrow { color: var(--text-secondary); transition: transform 0.2s ease; }
    .link-item:hover .arrow { transform: translateX(4px); }

    footer {
      margin-top: 64px; padding-top: 24px;
      border-top: 1px solid var(--border);
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      font-size: 13px; color: var(--text-secondary);
    }

    @media (max-width: 600px) {
      .container { padding: 56px 20px 64px; }
      h1 { font-size: 32px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="hero">
      <div class="profile-image-container">
        <canvas id="profileCanvas" class="profile-canvas"></canvas>
      </div>
      <h1 id="name">Benjamin Nguyen</h1>
      <p class="title" id="title"></p>
      <p class="location" id="location"></p>
      <p class="bio" id="bio"></p>

      <div class="section-label">About</div>
      <ul class="achievements" id="achievements"></ul>
    </section>

    <section class="section">
      <div class="section-label">Core Expertise</div>
      <div class="skills" id="skills"></div>
    </section>

    <section class="section">
      <div class="section-label">Career</div>
      <ul class="timeline" id="career"></ul>
    </section>

    <section class="section">
      <div class="section-label">Connect</div>
      <div class="links" id="connect"></div>

        </svg>
      </button>
      <span>© 2026 Benjamin Nguyen</span>
    </footer>
  </div>

  <script>
    // ---- Theme ----
    const root = document.documentElement;
    const toggle = document.getElementById('themeToggle');
    const saved = localStorage.getItem('theme');
    if (saved !== 'light') root.classList.add('dark'); // default dark

    toggle.addEventListener('click', () => {
      root.classList.toggle('dark');
      localStorage.setItem('theme', root.classList.contains('dark') ? 'dark' : 'light');
    });

    // ---- Content from profile.md ----
    const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

    async function loadProfile() {
      try {
        const md = await (await fetch('profile.md')).text();
        const lines = md.split('\n');

        let name = '', title = '', location = '', bio = '';
        const expertise = [], achievements = [];
        let listMode = null; // 'expertise' | 'achievements'

        for (let raw of lines) {
          const line = raw.trim();
          if (!line) continue;

          if (line.startsWith('# ')) {
            name = line.slice(2).trim();
          } else if (/^\*\*.+\*\*/.test(line) && !title) {
            // bold title line, possibly with trailing role text
            title = line.replace(/\*\*/g, '').trim();
          } else if (/^\*[^*].*\*$/.test(line) && !location) {
            location = line.replace(/^\*|\*$/g, '').trim();
          } else if (line.startsWith('## ')) {
            const h = line.slice(3).toLowerCase();
            if (h.includes('expertise')) listMode = 'expertise';
            else if (h.includes('achievement')) listMode = 'achievements';
            else listMode = null;
          } else if (line.startsWith('- ')) {
            const item = line.slice(2).trim();
            if (listMode === 'expertise') expertise.push(item);
            else if (listMode === 'achievements') achievements.push(item);
          } else if (!line.startsWith('#') && !line.startsWith('*') && !line.startsWith('-') && !bio && line.length > 50) {
            bio = line;
          }
        }

        if (name) {
          document.getElementById('name').textContent = name;
          document.title = name + ' — Aerospace Engineering';
        }
        document.getElementById('title').textContent = title;
        document.getElementById('location').textContent = location;
        document.getElementById('bio').textContent = bio;

        document.getElementById('skills').innerHTML =
          expertise.map(s => `<span class="skill-tag">${esc(s)}</span>`).join('');
        document.getElementById('achievements').innerHTML =
          achievements.map(a => `<li>${esc(a)}</li>`).join('');
      } catch (e) { console.error('profile load failed', e); }
    }

    async function loadCareer() {
      try {
        const md = await (await fetch('career.md')).text();
        const blocks = md.split('## ').slice(1);
        const items = blocks.map(b => {
          const ls = b.split('\n').map(l => l.trim()).filter(Boolean);
          const date = ls[0] || '';
          const role = (ls[1] || '').replace(/\*\*/g, '').trim();
          const org = (ls[2] || '').replace(/^\*|\*$/g, '').replace(/\*/g, '').trim();
          if (!date) return '';
          return `<li class="timeline-item">
            <div class="timeline-date">${esc(date)}</div>
            <div class="timeline-role">${esc(role)}</div>
            <div class="timeline-org">${esc(org)}</div>
          </li>`;
        }).join('');
        document.getElementById('career').innerHTML = items;
      } catch (e) { console.error('career load failed', e); }
    }

    async function loadContact() {
      try {
        const md = await (await fetch('contact.md')).text();
        const links = [];
        const emailMatch = md.match(/\*\*Email:\*\*\s*([^\s]+@[^\s]+)/i);
        if (emailMatch) links.push({ label: 'Email', href: 'mailto:' + emailMatch[1] });
        const liMatch = md.match(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/);
        if (liMatch) links.push({ label: 'LinkedIn', href: liMatch[2] });

        document.getElementById('connect').innerHTML = links.map(l =>
          `<a href="${esc(l.href)}" class="link-item">
            <span>${esc(l.label)}</span><span class="arrow">→</span>
          </a>`).join('');
      } catch (e) { console.error('contact load failed', e); }
    }

    loadProfile();
    loadCareer();
    loadContact();

    const canvas = document.getElementById('profileCanvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;

    function sizeCanvas() {
      canvas.width = canvas.offsetWidth * dpr;
      canvas.height = canvas.offsetHeight * dpr;
    }

    // Normalize raw dots (which used fullscreen coords) into the canvas box
    let dots = [];
    function buildDots() {
      const xs = RAW_DOTS.map(d => d.x), ys = RAW_DOTS.map(d => d.y);
      const minX = Math.min(...xs), maxX = Math.max(...xs);
      const minY = Math.min(...ys), maxY = Math.max(...ys);
      const srcW = maxX - minX, srcH = maxY - minY;

      const cw = canvas.width, ch = canvas.height;
      const pad = 0.10; // 10% padding
      const scale = Math.min(cw * (1 - pad) / srcW, ch * (1 - pad) / srcH);
      const offX = (cw - srcW * scale) / 2;
      const offY = (ch - srcH * scale) / 2;

      dots = RAW_DOTS.map(d => {
        const hx = offX + (d.x - minX) * scale;
        const hy = offY + (d.y - minY) * scale;
        return { homeX: hx, homeY: hy, x: hx, y: hy, vx: 0, vy: 0, b: d.b };
      });
    }
    const mouse = { x: -9999, y: -9999 };
    const forceRadius = 60 * dpr;

    function setForce(clientX, clientY) {
      const r = canvas.getBoundingClientRect();
      mouse.x = (clientX - r.left) * dpr;
      mouse.y = (clientY - r.top) * dpr;
    }
    function clearForce() { mouse.x = -9999; mouse.y = -9999; }

    // Ignore mouse events that the browser synthesizes from a touch — otherwise
    // a tap fires a stray mousemove that re-pushes the dots after touchend.
    let touchActive = false;
    canvas.addEventListener('mousemove', e => {
      if (touchActive) return;
      setForce(e.clientX, e.clientY);
    });
    canvas.addEventListener('mouseleave', clearForce);

    // never push. Passive listeners => page still scrolls.
    let touchStart = null, mode = null, holdTimer = null; // 'hold' | 'scroll'

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const r = getComputedStyle(root).getPropertyValue('--dot-r').trim();

    window.addEventListener('resize', () => {
